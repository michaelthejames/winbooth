<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Booth - Operator Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background: #0a0e27;
      color: #fff;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: auto auto 1fr;
      gap: 15px;
      padding: 20px;
      height: 100vh;
      overflow: hidden;
    }

    /* Header */
    header {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #8b008b 0%, #ff4444 100%);
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(139, 0, 139, 0.5);
    }

    h1 {
      font-size: 28px;
      text-shadow: 0 0 10px #ffff00;
    }

    .connection-status {
      display: flex;
      gap: 10px;
      font-size: 12px;
    }

    .connection-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff4444;
      animation: pulse 1s infinite;
    }

    .connection-indicator.connected {
      background: #00ff00;
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Health Status Panel */
    .health-panel {
      grid-column: 1;
      grid-row: 2;
      background: rgba(20, 10, 40, 0.9);
      border: 2px solid #8b008b;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 0 15px rgba(139, 0, 139, 0.3);
    }

    .health-panel h2 {
      font-size: 16px;
      margin-bottom: 15px;
      color: #ff8888;
      text-shadow: 0 0 5px #ff4444;
    }

    .health-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      margin-bottom: 8px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
      font-size: 13px;
    }

    .health-status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff4444;
      box-shadow: 0 0 8px #ff4444;
    }

    .status-dot.ok {
      background: #00ff00;
      box-shadow: 0 0 8px #00ff00;
    }

    /* Current Session Panel */
    .session-panel {
      grid-column: 2;
      grid-row: 2 / 4;
      background: rgba(20, 10, 40, 0.9);
      border: 2px solid #8b008b;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 0 15px rgba(139, 0, 139, 0.3);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .session-panel h2 {
      font-size: 14px;
      color: #ff8888;
      margin-bottom: 20px;
      text-shadow: 0 0 5px #ff4444;
    }

    .session-info {
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .session-info .label {
      color: #bb88bb;
      font-weight: bold;
    }

    .session-info .value {
      color: #88ff88;
    }

    .session-status {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 20px;
      text-shadow: 0 0 10px #ff4444;
    }

    .photo-counter {
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
      color: #ffff00;
      text-shadow: 0 0 10px #ffff00;
    }

    .idle-message {
      color: #bb88bb;
      font-size: 18px;
      margin-top: 40px;
    }

    /* Stats Panel */
    .stats-panel {
      grid-column: 3;
      grid-row: 2;
      background: rgba(20, 10, 40, 0.9);
      border: 2px solid #8b008b;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 0 15px rgba(139, 0, 139, 0.3);
    }

    .stats-panel h2 {
      font-size: 16px;
      margin-bottom: 15px;
      color: #ff8888;
      text-shadow: 0 0 5px #ff4444;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      margin-bottom: 8px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
      font-size: 13px;
    }

    .stat-label {
      color: #bb88bb;
    }

    .stat-value {
      color: #ffff00;
      font-weight: bold;
    }

    /* Error Log Panel */
    .error-panel {
      grid-column: 1 / 3;
      grid-row: 3;
      background: rgba(20, 10, 40, 0.9);
      border: 2px solid #8b008b;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 0 15px rgba(139, 0, 139, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;  
    }

    .error-panel h2 {
      font-size: 16px;
      margin-bottom: 10px;
      color: #ff8888;
      text-shadow: 0 0 5px #ff4444;
    }

    .error-log {
      flex: 1;
      overflow-y: auto;
      font-size: 16px;
      font-family: 'Courier New', monospace;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 4px;
      border-left: 3px solid #ff4444;
      min-height: 0;
      height: 100%; 
    }

    .error-entry {
      padding: 5px 0;
      border-bottom: 1px solid rgba(255, 68, 68, 0.2);
      line-height: 1.4;
    }

    .error-entry:last-child {
      border-bottom: none;
    }

    .error-time {
      color: #bb88bb;
    }

    .error-type {
      color: #ffff00;
      font-weight: bold;
    }

    .error-type.camera {
      color: #ff6666;
    }

    .error-type.obs {
      color: #ff8800;
    }

    .error-type.delivery {
      color: #ff4444;
    }

    .error-msg {
      color: #ff8888;
    }

    .error-empty {
      text-align: center;
      color: #666;
      padding: 20px 0;
    }

    /* History/Resend Panel */
    .history-panel {
      grid-column: 3;
      grid-row: 3;
      background: rgba(20, 10, 40, 0.9);
      border: 2px solid #8b008b;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 0 15px rgba(139, 0, 139, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden; 
    }

    .history-panel h2 {
      font-size: 16px;
      margin-bottom: 10px;
      color: #ff8888;
      text-shadow: 0 0 5px #ff4444;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      font-size: 16px;
      height: 100%; 
    }

    .history-item {
      padding: 8px;
      margin-bottom: 8px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
      border-left: 3px solid #00ff00;
    }

    .history-item.error {
      border-left-color: #ff4444;
      background: rgba(255, 68, 68, 0.1);
    }

    .history-name {
      color: #ffff00;
      font-weight: bold;
      margin-bottom: 3px;
    }

    .history-email {
      color: #88ff88;
      font-size: 10px;
      margin-bottom: 5px;
      word-break: break-all;
    }

    .history-time {
      color: #bb88bb;
      font-size: 10px;
      margin-bottom: 5px;
    }

    .history-status {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 9px;
      margin-right: 5px;
    }

    .history-status.success {
      background: rgba(0, 255, 0, 0.2);
      color: #00ff00;
    }

    .history-status.error {
      background: rgba(255, 68, 68, 0.2);
      color: #ff4444;
    }

    .resend-btn {
      padding: 3px 8px;
      background: #8b008b;
      color: #fff;
      border: 1px solid #ff4444;
      border-radius: 3px;
      cursor: pointer;
      font-size: 9px;
      margin-top: 5px;
      transition: all 0.2s;
    }

    .resend-btn:hover {
      background: #ff4444;
      box-shadow: 0 0 8px #ff4444;
    }

    .resend-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Alert Flash */
    .error-alert {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #ff4444;
      color: #000;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 0 20px #ff4444;
      font-weight: bold;
      animation: slideIn 0.3s ease-out, slideOut 5s ease-in 4.7s;
      z-index: 1000;
    }

    @keyframes slideIn {
      from { transform: translateX(400px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes slideOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(400px); opacity: 0; }
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
    }

    ::-webkit-scrollbar-thumb {
      background: #8b008b;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #ff4444;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <h1>Photobooth Control Panel</h1>
    <div class="connection-status">
      <button onclick="restartService('photo-booth-api')" style="padding: 8px 12px; margin-right: 10px; background: #8b008b; color: white; border: 1px solid #ff4444; border-radius: 4px; cursor: pointer;">Restart API</button>
    <button onclick="restartService('parsec-server')" style="padding: 8px 12px; margin-right: 20px; background: #8b008b; color: white; border: 1px solid #ff4444; border-radius: 4px; cursor: pointer;">Restart PARSEC</button>
      <span>Socket.IO:</span>
      <span class="connection-indicator" id="connection-indicator"></span>
    </div>
  </header>

  <!-- Health Panel -->
  <div class="health-panel">
    <h2>Booth Status</h2>
    <div class="health-item">
      <span>Camera</span>
      <div class="health-status">
        <div class="status-dot" id="health-camera"></div>
        <span id="health-camera-msg">Checking...</span>
      </div>
    </div>
    <div class="health-item">
      <span>OBS</span>
      <div class="health-status">
        <div class="status-dot" id="health-obs"></div>
        <span id="health-obs-msg">Checking...</span>
      </div>
    </div>
    <div class="health-item">
      <span>Email API</span>
      <div class="health-status">
        <div class="status-dot" id="health-email"></div>
        <span id="health-email-msg">Checking...</span>
      </div>
    </div>
  </div>

  <!-- Session Panel -->
  <div class="session-panel">
    <h2>CURRENT SESSION</h2>
    <div id="session-display">
      <div class="idle-message">WAITING FOR GUEST...</div>
    </div>
  </div>

  <!-- Stats Panel -->
  <div class="stats-panel">
    <h2>TODAY'S STATS</h2>
    <div class="stat-item">
      <span class="stat-label">Sessions</span>
      <span class="stat-value" id="stat-sessions">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Emails Sent</span>
      <span class="stat-value" id="stat-emails">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Errors</span>
      <span class="stat-value" id="stat-errors">0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Uptime</span>
      <span class="stat-value" id="stat-uptime">0h</span>
    </div>
  </div>

  <!-- Error Log Panel -->
  <div class="error-panel">
    <h2>⚠️ ERROR LOG (Last 20)</h2>
    <div class="error-log" id="error-log">
      <div class="error-empty">No errors yet...</div>
    </div>
  </div>

  <!-- Session History Panel -->
  <div class="history-panel">
    <h2>SESSION HISTORY</h2>
    <div class="history-list" id="history-list">
      <div class="error-empty">No sessions yet...</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const startTime = Date.now();

    async function restartService(service) {
  if (!confirm(`Restart ${service}?`)) return;
  
  try {
    const response = await fetch(`/session/restart-service/${service}`, { method: 'POST' });
    const result = await response.json();
    alert(result.message);
  } catch (err) {
    alert(`Failed to restart ${service}`);
  }
}

    // Connection status
    socket.on('connect', () => {
      document.getElementById('connection-indicator').classList.add('connected');
      console.log('Connected to server');
    });

    socket.on('disconnect', () => {
      document.getElementById('connection-indicator').classList.remove('connected');
      console.log('Disconnected from server');
    });

    // Session updates
    socket.on('session-started', (data) => {
      updateSessionDisplay(data);
    });

    socket.on('countdown', (data) => {
      updateSessionDisplay({ status: 'countdown', count: data.count });
    });

    socket.on('photo-taken', (data) => {
      updateSessionDisplay({ status: 'shooting', photoNumber: data.shot, totalPhotos: 3 });
    });

    socket.on('session-done', (data) => {
      updateSessionDisplay({ status: 'done' });
      setTimeout(() => {
        clearSessionDisplay();
      }, 5000);
      loadHistory();
      updateStats();
    });

    socket.on('session-error', (data) => {
      updateSessionDisplay({ status: 'error', error: data.message });
    });

    // Health updates
    socket.on('health-status', (health) => {
      updateHealth(health);
    });

    // Error alerts
    socket.on('error-alert', (error) => {
      showErrorAlert(error);
      loadErrorLog();
      updateStats();
    });

    // Load initial data
    async function loadInitialData() {
      try {
        const [health, errors, history] = await Promise.all([
          fetch('/session/health').then(r => r.json()),
          fetch('/session/errors/recent?count=20').then(r => r.json()),
          fetch('/session/history').then(r => r.json()),
        ]);

        updateHealth(health);
        displayErrors(errors);
        displayHistory(history.slice(-10).reverse());
        updateStats();
      } catch (err) {
        console.error('Failed to load initial data:', err);
      }
    }

    function updateHealth(health) {
      updateHealthItem('camera', health.camera);
      updateHealthItem('obs', health.obs);
      updateHealthItem('email', health.email);
    }

    function updateHealthItem(type, status) {
      const dot = document.getElementById(`health-${type}`);
      const msg = document.getElementById(`health-${type}-msg`);
      
      if (status.status === 'ok') {
        dot.classList.add('ok');
        msg.textContent = status.message;
      } else {
        dot.classList.remove('ok');
        msg.textContent = '✗ ' + status.message;
      }
    }

    function updateSessionDisplay(data) {
      const display = document.getElementById('session-display');
      
      if (data.status === 'waiting') {
        display.innerHTML = `
          <div class="session-info">
            <div><span class="label">Guest:</span> <span class="value">${data.name || 'N/A'}</span></div>
            <div><span class="label">Email:</span> <span class="value">${data.email || 'N/A'}</span></div>
            <div class="session-status" style="margin-top: 20px;">🪑 GETTING READY...</div>
          </div>
        `;
      } else if (data.status === 'countdown') {
        display.innerHTML = `
          <div class="session-status">📸 ${data.count}</div>
          <div style="font-size: 14px; color: #bb88bb;">Get ready!</div>
        `;
      } else if (data.status === 'shooting') {
        display.innerHTML = `
          <div class="photo-counter">${data.photoNumber} / ${data.totalPhotos}</div>
          <div style="font-size: 14px; color: #bb88bb;">Taking photos...</div>
        `;
      } else if (data.status === 'done') {
        display.innerHTML = `
          <div style="font-size: 16px; color: #00ff00; font-weight: bold;">✓ SESSION COMPLETE</div>
          <div style="font-size: 12px; color: #bb88bb; margin-top: 20px;">Photos sent to email</div>
        `;
      } else if (data.status === 'error') {
        display.innerHTML = `
          <div style="font-size: 16px; color: #ff4444; font-weight: bold;">✗ ERROR</div>
          <div style="font-size: 11px; color: #ff8888; margin-top: 20px;">${data.error}</div>
        `;
      }
    }

    function clearSessionDisplay() {
      const display = document.getElementById('session-display');
      display.innerHTML = '<div class="idle-message">🛑 WAITING FOR GUEST...</div>';
    }

    function displayErrors(errors) {
      const log = document.getElementById('error-log');
      
      if (errors.length === 0) {
        log.innerHTML = '<div class="error-empty">No errors yet...</div>';
        return;
      }

      log.innerHTML = errors.slice().reverse().map(e => {
        const time = new Date(e.timestamp).toLocaleTimeString();
        return `
          <div class="error-entry">
            <span class="error-time">[${time}]</span>
            <span class="error-type ${e.type}">${e.type.toUpperCase()}</span>
            <span class="error-msg">${e.message}</span>
            ${e.context ? `<div style="color: #888; font-size: 10px; margin-top: 2px;">→ ${e.context}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    async function loadErrorLog() {
      try {
        const errors = await fetch('/session/errors/recent?count=20').then(r => r.json());
        displayErrors(errors);
      } catch (err) {
        console.error('Failed to load error log:', err);
      }
    }

    function displayHistory(sessions) {
      const list = document.getElementById('history-list');
      
      if (sessions.length === 0) {
        list.innerHTML = '<div class="error-empty">No sessions yet...</div>';
        return;
      }

      list.innerHTML = sessions.map(s => {
        const time = new Date(s.timestamp).toLocaleTimeString();
        const isError = s.status === 'error';
        return `
          <div class="history-item ${isError ? 'error' : ''}">
            <div class="history-name">${s.name}</div>
            <div class="history-email">${s.email}</div>
            <div class="history-time">${time}</div>
            <div>
              <span class="history-status ${s.status}">${s.status.toUpperCase()}</span>
              <button class="resend-btn" onclick="resendEmail('${s.sessionId}', '${s.email}')">📧 Resend</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadHistory() {
      try {
        const sessions = await fetch('/session/history').then(r => r.json());
        displayHistory(sessions.slice(-10).reverse());
      } catch (err) {
        console.error('Failed to load history:', err);
      }
    }

    async function resendEmail(sessionId, email) {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = '⏳ Sending...';

      try {
        const response = await fetch(`/session/resend-email/${sessionId}`, { method: 'POST' });
        if (response.ok) {
          btn.textContent = '✓ Sent!';
          setTimeout(() => {
            btn.disabled = false;
            btn.textContent = '📧 Resend';
          }, 2000);
        } else {
          throw new Error('Resend failed');
        }
      } catch (err) {
        btn.textContent = '✗ Failed';
        btn.disabled = false;
        alert(`Failed to resend to ${email}`);
      }
    }

    function showErrorAlert(error) {
      const alert = document.createElement('div');
      alert.className = 'error-alert';
      alert.textContent = `⚠️ ${error.type.toUpperCase()}: ${error.message}`;
      document.body.appendChild(alert);

      setTimeout(() => {
        alert.remove();
      }, 5000);
    }

    async function updateStats() {
      try {
        const [sessions, errors] = await Promise.all([
          fetch('/session/history/today').then(r => r.json()),
          fetch('/session/errors/today').then(r => r.json()),
        ]);

        const emailCount = sessions.filter(s => s.status === 'success').length;
        const uptime = Math.floor((Date.now() - startTime) / 3600000);

        document.getElementById('stat-sessions').textContent = sessions.length;
        document.getElementById('stat-emails').textContent = emailCount;
        document.getElementById('stat-errors').textContent = errors.length;
        document.getElementById('stat-uptime').textContent = uptime + 'h';
      } catch (err) {
        console.error('Failed to update stats:', err);
      }
    }

    // Initial load
    loadInitialData();

    // Refresh health every 30 seconds
    setInterval(() => {
      fetch('/session/health')
        .then(r => r.json())
        .then(h => updateHealth(h))
        .catch(err => console.error('Health check failed:', err));
    }, 30000);

    // Refresh stats every 60 seconds
    setInterval(updateStats, 60000);
  </script>
</body>
</html>
