<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Booth - Operator Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', monospace;
      background: #1a1a1a;
      color: #00ff00;
      padding: 20px;
      overflow-y: auto;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #00ff00;
      text-shadow: 0 0 10px #00ff00;
      font-size: 28px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: #222;
      border: 2px solid #00ff00;
      border-radius: 4px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
    }

    .panel h2 {
      color: #00ff00;
      font-size: 14px;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .status-display {
      font-size: 32px;
      text-align: center;
      padding: 20px;
      margin: 10px 0;
      background: #111;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .status-idle {
      color: #888;
    }

    .status-countdown {
      color: #ffff00;
      text-shadow: 0 0 10px #ffff00;
    }

    .status-shooting {
      color: #ff4444;
      text-shadow: 0 0 10px #ff4444;
      animation: pulse 0.5s infinite;
    }

    .status-processing {
      color: #4488ff;
      text-shadow: 0 0 10px #4488ff;
    }

    .status-delivering {
      color: #44ff44;
      text-shadow: 0 0 10px #44ff44;
    }

    .status-done {
      color: #00ff00;
      text-shadow: 0 0 10px #00ff00;
    }

    .status-error {
      color: #ff0000;
      text-shadow: 0 0 10px #ff0000;
      animation: pulse 0.3s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #333;
      font-size: 14px;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .label {
      color: #888;
      font-weight: bold;
    }

    .value {
      color: #00ff00;
      text-align: right;
    }

    .photo-counter {
      font-size: 48px;
      text-align: center;
      color: #00ff00;
      padding: 20px;
      text-shadow: 0 0 10px #00ff00;
    }

    .log {
      background: #111;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 15px;
      height: 300px;
      overflow-y: auto;
      font-size: 12px;
      line-height: 1.5;
    }

    .log-entry {
      padding: 4px 0;
      border-bottom: 1px solid #222;
      color: #00ff00;
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .log-time {
      color: #666;
      margin-right: 10px;
    }

    .log-event {
      color: #00ff00;
    }

    .log-error {
      color: #ff4444;
    }

    .log-warning {
      color: #ffff00;
    }

    .connection-status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 10px;
    }

    .connected {
      background: #00ff00;
      color: #000;
    }

    .disconnected {
      background: #ff0000;
      color: #fff;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .stat-box {
      background: #111;
      border: 1px solid #333;
      padding: 15px;
      text-align: center;
      border-radius: 4px;
    }

    .stat-label {
      color: #888;
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .stat-value {
      color: #00ff00;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📸 PHOTO BOOTH OPERATOR DASHBOARD</h1>

    <div class="grid">
      <!-- Status Panel -->
      <div class="panel">
        <h2>Session Status</h2>
        <div class="status-display" id="status">IDLE</div>
        <div id="sessionInfo">
          <div class="info-row">
            <span class="label">Guest:</span>
            <span class="value">-</span>
          </div>
          <div class="info-row">
            <span class="label">Delivery:</span>
            <span class="value">-</span>
          </div>
          <div class="info-row">
            <span class="label">Contact:</span>
            <span class="value">-</span>
          </div>
          <div class="info-row">
            <span class="label">Session ID:</span>
            <span class="value" style="font-size: 11px; word-break: break-all;">-</span>
          </div>
        </div>
      </div>

      <!-- Photo Counter -->
      <div class="panel">
        <h2>Photos Captured</h2>
        <div class="photo-counter" id="photoCount">0 / 3</div>
        <div class="stats">
          <div class="stat-box">
            <div class="stat-label">Total Sessions</div>
            <div class="stat-value" id="totalSessions">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Uptime</div>
            <div class="stat-value" id="uptime">0m</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Event Log -->
    <div class="panel">
      <h2>Event Log</h2>
      <div class="log" id="eventLog"></div>
      <div id="connectionStatus" class="connection-status disconnected">
        ⚫ DISCONNECTED
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
const socket = io();
let currentSession = null;
let photosCaptured = 0;
let totalSessions = 0;
let startTime = Date.now();

const elements = {
  status: document.getElementById('status'),
  sessionInfo: document.getElementById('sessionInfo'),
  photoCount: document.getElementById('photoCount'),
  eventLog: document.getElementById('eventLog'),
  connectionStatus: document.getElementById('connectionStatus'),
  totalSessions: document.getElementById('totalSessions'),
  uptime: document.getElementById('uptime'),
};

function log(event, data = '') {
  const now = new Date();
  const time = now.toLocaleTimeString();
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  
  let html = `<span class="log-time">[${time}]</span>`;
  
  if (event.includes('error') || event.includes('Error')) {
    html += `<span class="log-error">${event}</span>`;
  } else if (event.includes('warn') || event.includes('Warning')) {
    html += `<span class="log-warning">${event}</span>`;
  } else {
    html += `<span class="log-event">${event}</span>`;
  }
  
  if (data) {
    html += ` ${data}`;
  }
  
  entry.innerHTML = html;
  elements.eventLog.appendChild(entry);
  elements.eventLog.scrollTop = elements.eventLog.scrollHeight;
  
  // Keep only last 100 entries
  const entries = elements.eventLog.querySelectorAll('.log-entry');
  if (entries.length > 100) {
    entries[0].remove();
  }
}

function setStatus(state, data = {}) {
  elements.status.textContent = state.toUpperCase();
  elements.status.className = `status-display status-${state}`;
  log(`Status changed: ${state}`);

  if (state === 'idle') {
    photosCaptured = 0;
    currentSession = null;
    updateSessionInfo();
  }
}

function updateSessionInfo() {
  let html = '';
  
  if (currentSession) {
    html = `
      <div class="info-row">
        <span class="label">Guest:</span>
        <span class="value">${currentSession.name}</span>
      </div>
      <div class="info-row">
        <span class="label">Delivery:</span>
        <span class="value">${currentSession.delivery.toUpperCase()}</span>
      </div>
      <div class="info-row">
        <span class="label">Contact:</span>
        <span class="value">${currentSession.email || currentSession.phone || '-'}</span>
      </div>
      <div class="info-row">
        <span class="label">Session ID:</span>
        <span class="value" style="font-size: 11px; word-break: break-all;">${currentSession.id}</span>
      </div>
    `;
  } else {
    html = `
      <div class="info-row">
        <span class="label">Guest:</span>
        <span class="value">-</span>
      </div>
      <div class="info-row">
        <span class="label">Delivery:</span>
        <span class="value">-</span>
      </div>
      <div class="info-row">
        <span class="label">Contact:</span>
        <span class="value">-</span>
      </div>
      <div class="info-row">
        <span class="label">Session ID:</span>
        <span class="value">-</span>
      </div>
    `;
  }
  
  elements.sessionInfo.innerHTML = html;
}

function updatePhotoCount() {
  elements.photoCount.textContent = `${photosCaptured} / 3`;
}

function updateUptime() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const minutes = Math.floor(elapsed / 60);
  const hours = Math.floor(minutes / 60);
  
  if (hours > 0) {
    elements.uptime.textContent = `${hours}h ${minutes % 60}m`;
  } else {
    elements.uptime.textContent = `${minutes}m`;
  }
}

// Socket.IO Events
socket.on('connect', () => {
  log('✓ Connected to server');
  elements.connectionStatus.textContent = '🟢 CONNECTED';
  elements.connectionStatus.className = 'connection-status connected';
});

socket.on('disconnect', () => {
  log('✗ Disconnected from server');
  elements.connectionStatus.textContent = '🔴 DISCONNECTED';
  elements.connectionStatus.className = 'connection-status disconnected';
});

socket.on('stateChange', (data) => {
  log('State change:', data.state);
  setStatus(data.state);

  if (data.state === 'countdown') {
    currentSession = {
      id: data.sessionId,
      name: data.guestName || 'Guest',
      delivery: data.delivery || 'unknown',
      email: data.email,
      phone: data.phone,
    };
    photosCaptured = 0;
    updateSessionInfo();
    updatePhotoCount();
    totalSessions++;
    elements.totalSessions.textContent = totalSessions;
  }

  if (data.error) {
    log('ERROR:', data.error);
  }
});

socket.on('countdown', (data) => {
  log(`Countdown: ${data.count}`);
});

socket.on('preview', (data) => {
  photosCaptured = data.shotNumber;
  updatePhotoCount();
  log(`Photo captured: Shot ${data.shotNumber}`);
});

socket.on('stripReady', (data) => {
  log('Strip ready and delivered');
});

// Update uptime every minute
setInterval(updateUptime, 60000);
updateUptime();

// Initial state
setStatus('idle');
updateSessionInfo();
updatePhotoCount();
  </script>
</body>
</html>
