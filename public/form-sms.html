<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Booth - Capture Your Soul</title>
  <style>
    @font-face {
      font-family: 'melt';
      src: url('/melt.ttf') format('truetype');
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'melt', 'Arial', sans-serif;
      background: #0a0e27;
      background-image: 
        radial-gradient(circle at 20% 50%, rgba(139, 0, 139, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(255, 0, 0, 0.05) 0%, transparent 50%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }

    .container {
      background: rgba(20, 10, 40, 0.95);
      border: 3px solid #8b008b;
      border-radius: 8px;
      box-shadow: 
        0 0 30px rgba(139, 0, 139, 0.6),
        0 0 60px rgba(255, 0, 0, 0.2),
        inset 0 0 20px rgba(139, 0, 139, 0.1);
      max-width: 500px;
      width: 100%;
      padding: 40px;
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 10px,
        rgba(139, 0, 139, 0.03) 10px,
        rgba(139, 0, 139, 0.03) 20px
      );
      animation: drift 20s linear infinite;
      pointer-events: none;
    }

    @keyframes drift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(50px, 50px); }
    }

    h1 {
      font-size: 48px;
      text-align: center;
      margin-bottom: 10px;
      color: #ff4444;
      text-shadow: 
        0 0 2px #ff4444,
        0 0 10px #8b008b,
        2px 5px 0 #000;
      letter-spacing: 2px;
      position: relative;
      z-index: 1;
    }

    .subtitle {
      text-align: center;
      color: #bb88bb;
      margin-bottom: 30px;
      font-size: 14px;
      letter-spacing: 3px;
      position: relative;
      z-index: 1;
    }

    .form-group {
      margin-bottom: 25px;
      position: relative;
      z-index: 1;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #ff8888;
      font-weight: bold;
      text-shadow: 0 0 5px #ff4444;
      letter-spacing: 1px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select {
      width: 100%;
      padding: 12px;
      background: rgba(30, 10, 50, 0.8);
      border: 2px solid #8b008b;
      border-radius: 4px;
      color: #fff;
      font-family: 'melt', 'Arial', sans-serif;
      font-size: 16px;
      box-shadow: inset 0 0 10px rgba(139, 0, 139, 0.2);
      transition: all 0.3s;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus,
    select:focus {
      outline: none;
      border-color: #ff4444;
      box-shadow: 
        inset 0 0 10px rgba(139, 0, 139, 0.2),
        0 0 10px #ff4444;
    }

    .radio-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .radio-option {
      position: relative;
    }

    .radio-option input[type="radio"] {
      position: absolute;
      opacity: 0;
    }

    .radio-option label {
      display: block;
      padding: 15px;
      border: 2px solid #8b008b;
      border-radius: 4px;
      cursor: pointer;
      text-align: center;
      margin-bottom: 0;
      transition: all 0.3s;
      background: rgba(30, 10, 50, 0.8);
      text-shadow: none;
    }

    .radio-option input[type="radio"]:checked + label {
      background: rgba(139, 0, 139, 0.5);
      border-color: #ff4444;
      color: #ffaaaa;
      box-shadow: 0 0 15px #ff4444;
    }

    .delivery-details {
      display: none;
    }

    .delivery-details.active {
      display: block;
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #8b008b 0%, #ff4444 100%);
      color: #fff;
      border: 2px solid #ff4444;
      border-radius: 4px;
      font-family: 'melt', sans-serif;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
      box-shadow: 0 0 15px rgba(255, 68, 68, 0.5);
      letter-spacing: 1px;
      position: relative;
      z-index: 1;
    }

    .submit-btn:hover {
      box-shadow: 
        0 0 20px #ff4444,
        0 0 40px #8b008b;
      transform: translateY(-2px);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
      position: relative;
      z-index: 1;
      border-left: 4px solid;
    }

    .message.error {
      background: rgba(200, 0, 0, 0.2);
      color: #ff8888;
      border-left-color: #ff4444;
      box-shadow: 0 0 10px rgba(255, 68, 68, 0.3);
    }

    .message.success {
      background: rgba(0, 100, 0, 0.2);
      color: #88ff88;
      border-left-color: #00ff00;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 30px;
      position: relative;
      z-index: 1;
    }

    .spinner {
      border: 4px solid rgba(139, 0, 139, 0.3);
      border-top: 4px solid #ff4444;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
      box-shadow: 0 0 15px #ff4444;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading p {
      color: #bb88bb;
      letter-spacing: 1px;
    }

    fieldset {
      border: none;
      padding: 0;
      margin: 0;
    }

    legend {
      color: #ff8888;
      font-weight: bold;
      margin-bottom: 15px;
      letter-spacing: 1px;
      text-shadow: 0 0 5px #ff4444;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>PHOTO BOOTH</h1>
    <p class="subtitle">CAPTURE YOUR SOUL...</p>

    <div id="message" class="message"></div>

    <form id="form">
      <div class="form-group">
        <label for="name">YOUR NAME</label>
        <input type="text" id="name" autocomplete="name" required>
      </div>

      <fieldset class="form-group">
        <legend>HOW SHALL WE DELIVER YOUR CURSE?</legend>
        <div class="radio-group">
          <div class="radio-option">
            <input type="radio" id="delivery-email" name="delivery" value="email" checked>
            <label for="delivery-email">CURSE BY EMAIL</label>
          </div>
          <div class="radio-option">
            <input type="radio" id="delivery-sms" name="delivery" value="sms">
            <label for="delivery-sms">CURSE BY TEXT</label>
          </div>
        </div>
      </fieldset>

      <div id="emailSection" class="form-group delivery-details active">
        <label for="email">EMAIL OF THE DAMNED</label>
        <input type="email" id="email" autocomplete="email" placeholder="example@email.com">
      </div>

      <div id="smsSection" class="form-group delivery-details" style="display:none;">
        <label for="phone">PHONE NUMBER</label>
        <input type="tel" id="phone" autocomplete="tel" placeholder="+1 (555) 123-4567" pattern="[0-9\+\-\(\)\s]+">
      </div>

      <button type="submit" class="submit-btn" id="submit-btn">SUMMON THE SPIRITS</button>
    </form>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>are you ready?</p>
    </div>
  </div>

  <script>
    function toggleDelivery() {
  const delivery = document.querySelector('input[name="delivery"]:checked').value;
  
  if (delivery === 'email') {
    document.getElementById('emailSection').style.display = 'block';
    document.getElementById('smsSection').style.display = 'none';
    document.getElementById('email').required = true;
    document.getElementById('phone').required = false;
  } else {
    document.getElementById('emailSection').style.display = 'none';
    document.getElementById('smsSection').style.display = 'block';
    document.getElementById('email').required = false;
    document.getElementById('phone').required = true;
  }
}

    document.querySelectorAll('input[name="delivery"]').forEach(radio => {
      radio.addEventListener('change', toggleDelivery);
    });

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('name').value;
      const delivery = document.querySelector('input[name="delivery"]:checked').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      
      // Validate email format
      if (delivery === 'email') {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
          showMessage('⚠️ Please enter a valid email address', 'error');
          return;
        }
      }
      
      // Validate phone format
      if (delivery === 'sms') {
        const phoneRegex = /^[0-9\+\-\(\)\s]{10,}$/;
        if (!phoneRegex.test(phone)) {
          showMessage('⚠️ Please enter a valid phone number', 'error');
          return;
        }
      }
      
      try {
        document.getElementById('form').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        const response = await fetch('/session/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, delivery, email, phone })
        });
        
        if (!response.ok) throw new Error('API error: ' + response.status);
        
        // Show success screen instead of redirecting
        showSuccessScreen(delivery === 'email' ? email : phone, delivery);
      } catch (err) {
        const msg = document.getElementById('message');
        msg.textContent = '⚠️ ERROR: ' + err.message;
        msg.className = 'message error';
        msg.style.display = 'block';
        document.getElementById('form').style.display = 'block';
        document.getElementById('loading').style.display = 'none';
      }
    });

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
      msg.style.display = 'block';
    }

    function showSuccessScreen(contact, method) {
      const form = document.getElementById('form');
      const loading = document.getElementById('loading');
      const message = document.getElementById('message');
      
      form.style.display = 'none';
      loading.style.display = 'none';
      message.style.display = 'none';
      
      const successScreen = document.createElement('div');
      successScreen.id = 'successScreen';
      successScreen.style.cssText = `
        text-align: center;
        padding: 60px 20px;
        position: relative;
        z-index: 1;
      `;
      
      const methodText = method === 'email' ? 'email' : 'text message';
      successScreen.innerHTML = `
        <div style="font-size: 80px; margin-bottom: 20px;">✓</div>
        <h2 style="color: #88ff88; font-size: 32px; margin-bottom: 20px; text-shadow: 0 0 10px #00ff00;">YOUR PHOTOS ARE ON THE WAY!</h2>
        <p style="color: #bb88bb; font-size: 18px; margin-bottom: 40px;">Check your ${methodText}</p>
        <p style="color: #888; font-size: 14px;">Taking you back in a moment...</p>
      `;
      
      const container = document.querySelector('.container');
      container.appendChild(successScreen);
      
      // Show for 4 seconds then reset
      setTimeout(() => {
        successScreen.remove();
        resetForm();
      }, 4000);
    }

    function resetForm() {
      const form = document.getElementById('form');
      const loading = document.getElementById('loading');
      
      form.style.display = 'block';
      loading.style.display = 'none';
      document.getElementById('name').value = '';
      document.getElementById('email').value = '';
      document.getElementById('phone').value = '';
      document.getElementById('delivery').value = 'email';
      document.getElementById('message').style.display = 'none';
      document.getElementById('submit-btn').disabled = false;
      toggleDelivery();
    }
  </script>
</body>
</html>
