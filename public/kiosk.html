<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Kiosk Input</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: transparent;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: rgba(0, 0, 0, 0.85);
            padding: 40px;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            color: white;
        }
        .title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #00a8ff;
        }
        .prompt {
            font-size: 18px;
            margin-bottom: 15px;
            color: #aaa;
            min-height: 25px;
        }
        .input-display {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #00a8ff;
            padding: 15px;
            border-radius: 5px;
            font-size: 20px;
            font-weight: bold;
            min-height: 30px;
            word-break: break-all;
            margin-bottom: 20px;
        }
        .info {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 20px;
        }
        .cursor {
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .status {
            text-align: center;
            font-size: 16px;
            margin-top: 20px;
            min-height: 20px;
            color: #4ade80;
        }
    </style>
</head>
<body>
    <!-- Hidden input to capture keyboard -->
    <input type="text" id="hiddenInput" style="position: absolute; left: -9999px; opacity: 0;">
    
    <div class="container">
        
        <div class="prompt" id="prompt">Enter your name:</div>
        <div class="input-display" id="display">
            <span id="text"></span><span class="cursor">_</span>
        </div>
        
        <div class="status" id="status"></div>
        <div class="info">Press ENTER to continue</div>
    </div>

    <script>
        const API_URL = 'http://localhost:3001';
        let currentInput = '';
        let state = 'name'; // name, email, confirm
        let name = '';
        let email = '';

        const promptEl = document.getElementById('prompt');
        const displayEl = document.getElementById('text');
        const statusEl = document.getElementById('status');

        function updateDisplay() {
            displayEl.textContent = currentInput;
        }

        async function submitSession() {
            statusEl.textContent = 'Starting session...';
            try {
                const response = await fetch(`${API_URL}/session/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email })
                });

                if (response.ok || response.status === 201) {
                    statusEl.textContent = '✓ Session started! Have a seat!';
                    statusEl.style.color = '#4ade80';
                    
                    setTimeout(() => {
                        reset();
                    }, 3000);
                } else {
                    statusEl.textContent = '✗ Failed to start session';
                    statusEl.style.color = '#ff6b6b';
                    setTimeout(() => reset(), 2000);
                }
            } catch (e) {
                statusEl.textContent = '✗ Connection error';
                statusEl.style.color = '#ff6b6b';
                setTimeout(() => reset(), 2000);
            }
        }

        function reset() {
            currentInput = '';
            state = 'name';
            name = '';
            email = '';
            statusEl.textContent = '';
            statusEl.style.color = '#4ade80';
            promptEl.textContent = 'Enter your name:';
            updateDisplay();
        }

        // Capture ALL keyboard events globally
        document.addEventListener('keydown', handleKeyDown, true);
        window.addEventListener('keydown', handleKeyDown, true);

        function handleKeyDown(e) {
            // Prevent OBS from consuming the key
            e.stopPropagation();

            if (e.key === 'Enter') {
                e.preventDefault();

                if (state === 'name') {
                    if (currentInput.trim()) {
                        name = currentInput;
                        state = 'email';
                        currentInput = '';
                        promptEl.textContent = 'Enter your email:';
                        updateDisplay();
                    }
                } else if (state === 'email') {
                    if (currentInput.trim()) {
                        email = currentInput;
                        state = 'confirm';
                        promptEl.textContent = `Name: ${name} | Email: ${email} | Press ENTER to submit`;
                        currentInput = '';
                        updateDisplay();
                        submitSession();
                    }
                }
            } else if (e.key === 'Backspace') {
                e.preventDefault();
                currentInput = currentInput.slice(0, -1);
                updateDisplay();
            } else if (e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
                e.preventDefault();
                currentInput += e.key;
                updateDisplay();
            }
        }

        // Force focus on hidden input on load
        window.addEventListener('load', () => {
            const hiddenInput = document.getElementById('hiddenInput');
            hiddenInput.focus();
            // Keep it focused
            setInterval(() => {
                if (document.activeElement !== hiddenInput) {
                    hiddenInput.focus();
                }
            }, 100);
        });

        // Also capture keypress to prevent defaults
        document.addEventListener('keypress', (e) => {
            e.stopPropagation();
        }, true);
    </script>
</body>
</html>
