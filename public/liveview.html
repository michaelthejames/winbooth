<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Live View</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    width: 100%;
    height: 100%;
}

#liveview {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    display: block;
}
</style>

</head>
<body>

<img
    id="liveview"
    src="https://localhost:3000/camera/0/liveView"
    alt="Live View"
/>

<script>
const img = document.getElementById("liveview");



img.onload = () => {
    console.log("Live view connected.");
};
</script>

</body>
</html>
