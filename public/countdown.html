<!DOCTYPE html>
<html>
<head>
  <style>
    body { margin: 0; background: transparent; }
    #countdown {
      font-size: 200px;
      font-weight: bold;
      color: #15ff00;
      text-align: center;
      line-height: 1;
      text-shadow: 0 0 20px #15ff00;
      font-family: melt, sans-serif;
    }
  </style>
</head>
<body>
  <div id="countdown"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    socket.on('countdown', (data) => {
      document.getElementById('countdown').textContent = data.count;
    });
  </script>
</body>
</html>
