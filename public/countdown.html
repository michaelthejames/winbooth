<!DOCTYPE html>
<html>
<head>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&display=swap');
  
    body { margin: 0; background: transparent; }
    #countdown {
      font-family: 'Bitcount Grid Double', sans-serif;
      font-size: 200px;
      font-weight: normal;
      color: rgb(30, 0, 138);
      text-align: center;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div id="countdown" style="font-size: 300px; color: rgb(11, 180, 127); font-weight: normal;"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    
    socket.on('stateChange', (data) => {
      // Clear when countdown state starts
      if (data.state === 'countdown') {
        document.getElementById('countdown').textContent = '';
      }
    });
    
    socket.on('countdown', (data) => {
      document.getElementById('countdown').textContent = data.count;
    });
  </script>
</body>
</html>
