<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Rubik+Maze&display=swap" rel="stylesheet">
<style>
    body { margin: 0; background: transparent; }
    #countdown {
      font-family: 'Rubik Maze', system-ui;
      font-weight: 400;
      font-style: normal;
    }
</style>
</head>
<body>
  <div id="countdown" style="font-family: 'Rubik Maze', system-ui; font-size: 300px; color: rgb(195, 198, 25); font-weight: 400; font-style: normal; text-align:center"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    
    socket.on('stateChange', (data) => {
      if (data.state === 'countdown') {
        document.getElementById('countdown').textContent = '';
      }
    });
    
    socket.on('countdown', (data) => {
      document.getElementById('countdown').textContent = data.count;
    });
  </script>
</body>
</html>
